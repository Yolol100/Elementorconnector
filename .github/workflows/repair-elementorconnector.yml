name: One-time release blocker repair

on:
  push:
    branches:
      - repair/release-blockers-2026-09-03

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply exact repair
        run: python3 .github/repair_elementorconnector.py

      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Zero-dependency regression tests
        run: |
          php tests/wordpress-content-sync.php
          php tests/content-request-safety.php

      - name: Remove one-time repair tooling
        run: |
          rm .github/repair_elementorconnector.py
          rm .github/workflows/repair-elementorconnector.yml

      - name: Commit repaired sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix release blockers and request safety'
          git push origin HEAD:${GITHUB_REF_NAME}
