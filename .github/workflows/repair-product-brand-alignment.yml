name: One-time WooCommerce brand ownership repair

on:
  push:
    branches:
      - repair/release-blockers-2026-09-03

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply exact product-brand repair
        run: python3 .github/repair_product_brand_alignment.py

      - name: Correct literal regression assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/content-request-safety.php')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'str_contains($products, "$content[\'taxonomies\'][\'product_brand\'] = $slugs")',
              'str_contains($products, "\\$content[\'taxonomies\'][\'product_brand\'] = \\$slugs")',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Zero-dependency regression tests
        run: |
          php tests/wordpress-content-sync.php
          php tests/content-request-safety.php

      - name: Remove one-time repair tooling
        run: |
          rm .github/repair_product_brand_alignment.py
          rm .github/workflows/repair-product-brand-alignment.yml

      - name: Commit repaired sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Align WooCommerce product brand ownership'
          git push origin HEAD:${GITHUB_REF_NAME}
