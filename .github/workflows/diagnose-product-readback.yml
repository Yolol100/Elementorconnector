name: Diagnose product readback

on:
  push:
    branches:
      - fix/ci-runtime-20260903
    paths:
      - .github/workflows/diagnose-product-readback.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add test-only mismatch details in the runner workspace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('includes/Content/ProductRequest.php')
          text = path.read_text(encoding='utf-8')
          old = """\t\tif ( ! hash_equals( CanonicalJson::hash( $woo ), CanonicalJson::hash( $read_woo ) ) ) {\n\t\t\tthrow new RuntimeException( 'WooCommerce product data failed exact readback verification.' );\n\t\t}"""
          new = """\t\tif ( ! hash_equals( CanonicalJson::hash( $woo ), CanonicalJson::hash( $read_woo ) ) ) {\n\t\t\t$mismatches = [];\n\t\t\tforeach ( array_unique( array_merge( array_keys( $woo ), array_keys( $read_woo ) ) ) as $field ) {\n\t\t\t\t$desired = [ 'present' => array_key_exists( $field, $woo ), 'value' => $woo[ $field ] ?? null ];\n\t\t\t\t$actual  = [ 'present' => array_key_exists( $field, $read_woo ), 'value' => $read_woo[ $field ] ?? null ];\n\t\t\t\tif ( CanonicalJson::hash( $desired ) !== CanonicalJson::hash( $actual ) ) {\n\t\t\t\t\t$mismatches[ $field ] = [ 'desired' => $desired, 'actual' => $actual ];\n\t\t\t\t}\n\t\t\t}\n\t\t\tthrow new RuntimeException( 'WooCommerce product data failed exact readback verification: ' . wp_json_encode( $mismatches ) );\n\t\t}"""
          if text.count(old) != 1:
              raise SystemExit('Expected exact WooCommerce verification block once.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          php -l includes/Content/ProductRequest.php

      - name: Install pinned wp-env
        run: npm install --global @wordpress/env@11.14.0

      - name: Start current integration runtime
        run: wp-env --config=.wp-env.json start

      - name: Run full product and extension scenarios with diagnostics
        id: diagnostic
        continue-on-error: true
        run: wp-env --config=.wp-env.json run cli wp eval-file wp-content/ejb-runtime-tests/content-operations.php

      - name: Stop runtime
        if: always()
        run: wp-env --config=.wp-env.json stop || true

      - name: Require the diagnostic scenario to pass
        if: steps.diagnostic.outcome != 'success'
        run: exit 1
