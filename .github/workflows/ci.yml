name: Plugin quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Zero-dependency tests
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          php tests/run.php

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-lock

      - name: Install development tools
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Coding standards and PHP compatibility
        run: composer phpcs

      - name: Dependency audit
        run: composer audit

      - name: Build release package twice
        if: matrix.php == '8.3'
        run: |
          bash scripts/build-zip.sh
          cp dist/elementor-json-bridge.zip /tmp/elementor-json-bridge-first.zip
          bash scripts/build-zip.sh
          cmp /tmp/elementor-json-bridge-first.zip dist/elementor-json-bridge.zip

      - name: Upload audit artifacts
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-audit-${{ github.sha }}
          path: |
            dist/elementor-json-bridge.zip
            dist/elementor-json-bridge.zip.sha256
            composer.lock
          if-no-files-found: error
          retention-days: 14

  plugin-check:
    name: Plugin Check release-package canary
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Build exact release package
        run: bash scripts/build-zip.sh

      - name: WordPress Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ./dist/elementor-json-bridge
          categories: |
            general
            security
            performance
            accessibility
