name: Plugin quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Zero-dependency tests
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          php tests/run.php
          php tests/background-authorization.php
          php tests/sync-roundtrip.php
          regression_status=0
          php tests/secretbox-invalid-packages.php || regression_status=1
          php tests/snapshot-integrity.php || regression_status=1
          php tests/elementor-canonicalization.php || regression_status=1
          exit "$regression_status"

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-lock

      - name: Install development tools
        run: composer install --no-interaction --prefer-dist

      - name: Coding standards and PHP compatibility
        run: composer phpcs

      - name: Dependency audit
        run: composer audit

      - name: Build release package twice
        if: matrix.php == '8.3'
        run: |
          bash scripts/build-zip.sh
          cp dist/elementor-json-bridge.zip /tmp/elementor-json-bridge-first.zip
          bash scripts/build-zip.sh
          cmp --silent /tmp/elementor-json-bridge-first.zip dist/elementor-json-bridge.zip
          sha256sum /tmp/elementor-json-bridge-first.zip dist/elementor-json-bridge.zip

      - name: Upload release package
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: elementor-json-bridge
          path: dist/elementor-json-bridge.zip
          if-no-files-found: error

  runtime:
    name: Runtime ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: WordPress 6.8.3 / PHP 8.1
            config: .wp-env.6.8.json
          - label: latest WordPress / PHP 8.3
            config: .wp-env.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned wp-env
        run: npm install --global @wordpress/env@11.14.0

      - name: Start WordPress and Elementor
        run: wp-env --config="${{ matrix.config }}" start

      - name: Confirm real runtime
        run: |
          wp-env --config="${{ matrix.config }}" run cli wp core version
          wp-env --config="${{ matrix.config }}" run cli wp plugin is-active elementor

      - name: Elementor document save and readback
        run: wp-env --config="${{ matrix.config }}" run cli wp eval-file wp-content/ejb-runtime-tests/elementor-documents-roundtrip.php

      - name: Stop runtime
        if: always()
        run: wp-env --config="${{ matrix.config }}" stop || true

  plugin-check:
    name: Plugin Check private-release canary
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Build exact release package
        run: bash scripts/build-zip.sh

      - name: WordPress Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ./dist/elementor-json-bridge
          categories: |
            general
            security
            performance
            accessibility
          # RuntimeException strings are internal error data, not HTML output. The admin/REST
          # presentation boundary escapes them before rendering. The two meta queries are
          # intentional and bounded: max 200 Elementor documents in the admin list and a
          # 20-document polling batch on plugin-owned enable metadata.
          ignore-codes: |
            WordPress.Security.EscapeOutput.ExceptionNotEscaped
            WordPress.DB.SlowDBQuery.slow_db_query_meta_key
            WordPress.DB.SlowDBQuery.slow_db_query_meta_value
