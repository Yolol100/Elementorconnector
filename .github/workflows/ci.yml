name: Plugin quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Zero-dependency gates
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          php tests/run.php
          php tests/repository-identity-migration.php
          bash tests/workflow-policy.sh
          bash tests/reproducible-build.sh

      - name: Development quality tools
        run: |
          composer validate --strict --no-check-lock
          composer update --no-interaction --prefer-dist --no-progress
          composer phpcs
          composer phpstan
          composer audit

      - name: Upload resolved dependency lock
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composer-lock-candidate
          path: composer.lock
          if-no-files-found: error
          retention-days: 1

  runtime:
    name: WordPress / Elementor runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      - name: Build runtime package
        run: bash scripts/build-zip.sh

      - name: Private-release Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ./dist/elementor-json-bridge
          categories: |
            general
            security
            performance
            accessibility
          # Plugin Check's PHPCS layer treats RuntimeException constructor arguments as browser output.
          # Domain exceptions are data; actual admin HTML is escaped and unexpected REST failures are generic.
          ignore-codes: WordPress.Security.EscapeOutput.ExceptionNotEscaped
          include-experimental: false

      - name: Bridge runtime smoke
        run: |
          cp tests/wp-runtime.php dist/elementor-json-bridge/.ejb-runtime-smoke.php
          wp-env run cli wp eval 'require WP_PLUGIN_DIR . "/elementor-json-bridge/.ejb-runtime-smoke.php";'
