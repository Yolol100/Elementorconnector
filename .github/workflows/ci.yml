name: Plugin quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Zero-dependency tests
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          php tests/run.php

      - name: Validate locked Composer metadata
        run: composer validate --strict

      - name: Install locked development tools
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Coding standards and PHP compatibility
        run: composer phpcs

      - name: Dependency audit
        run: composer audit --locked

      - name: Build release package twice
        if: matrix.php == '8.3'
        run: |
          bash scripts/build-zip.sh
          cp dist/elementor-json-bridge.zip /tmp/elementor-json-bridge-first.zip
          bash scripts/build-zip.sh
          cmp /tmp/elementor-json-bridge-first.zip dist/elementor-json-bridge.zip

      - name: Upload audit artifacts
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-audit-${{ github.sha }}
          path: |
            dist/elementor-json-bridge.zip
            dist/elementor-json-bridge.zip.sha256
          if-no-files-found: error
          retention-days: 14

  runtime-smoke:
    name: WordPress 7.1 + Elementor 4.2.3 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install pinned wp-env
        run: npm install --global --no-fund --no-audit @wordpress/env@11.14.0

      - name: Start pinned WordPress environment
        run: |
          cp .wp-env.smoke.json .wp-env.json
          wp-env start --update

      - name: Activate exact dependencies
        run: |
          wp-env run cli wp plugin activate elementor
          wp-env run cli wp plugin activate elementor-json-bridge

      - name: Run Elementor document roundtrip smoke test
        run: wp-env run cli wp --user=admin eval-file wp-content/plugins/elementor-json-bridge/tests/integration/smoke.php

      - name: Destroy smoke environment
        if: always()
        run: wp-env destroy --force

  plugin-check:
    name: Plugin Check release-package canary
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Build exact release package
        run: bash scripts/build-zip.sh

      - name: WordPress Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ./dist/elementor-json-bridge
          categories: |
            general
            security
            performance
            accessibility
