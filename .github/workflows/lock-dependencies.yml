name: Generate dependency lock

on:
  push:
    branches: [audit/2026-best-practices]
    paths:
      - .github/workflows/lock-dependencies.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Generate and validate lockfile
        run: |
          rm -f composer.lock
          composer update --no-interaction --prefer-dist --no-progress
          composer validate --strict
          composer audit --locked

      - name: Commit generated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'Lock development quality dependencies'
          git push origin HEAD:audit/2026-best-practices
