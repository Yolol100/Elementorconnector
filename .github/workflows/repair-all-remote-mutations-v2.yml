name: One-time all remote mutations v2 repair

on:
  push:
    branches:
      - repair/release-blockers-2026-09-03

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply v2 safety contracts
        run: python3 .github/repair_all_remote_mutations_v2_driver.py

      - name: Align static regression sources
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/content-request-safety.php')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "$abilities = file_get_contents($root . '/includes/Sync/WordPressAbilities.php');",
              "$abilities = file_get_contents($root . '/includes/Sync/WordPressAbilities.php');\n$abilityBridge = file_get_contents($root . '/includes/Content/AbilityBridge.php');",
          )
          text = text.replace(
              '[$posts, $products, $variations, $productExtras, $plugin, $terms, $requests, $abilities, $uninstall, $wpEnv, $ci]',
              '[$posts, $products, $variations, $productExtras, $plugin, $terms, $requests, $abilities, $abilityBridge, $uninstall, $wpEnv, $ci]',
          )
          text = text.replace(
              "str_contains($products, \"'action'     => 'read'\")",
              "str_contains($products, \"'read' === $action\")",
          )
          text = text.replace(
              "str_contains($abilities, 'public const VERSION = 2') && str_contains($abilities, \"true === ( $annotations['readonly'] ?? false )\")",
              "str_contains($abilityBridge, 'public const VERSION = 2') && str_contains($abilityBridge, \"true === ( $annotations['readonly'] ?? false )\")",
          )
          path.write_text(text, encoding='utf-8')

          path = Path('tests/wordpress-content-sync.php')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "$assert(str_contains($abilities, 'confirm_destructive=true'), 'Destructive Ability execution no longer requires explicit confirmation.');",
              "$assert(str_contains($abilities, \"true === ( $annotations['readonly'] ?? false )\") && str_contains($abilities, 'Use guarded versioned CRUD requests'), 'Generic Ability execution is not restricted to explicitly read-only abilities.');",
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Zero-dependency regression tests
        run: |
          php tests/wordpress-content-sync.php
          php tests/content-request-safety.php
          php tests/run.php
          php tests/background-authorization.php

      - name: Remove one-time repair tooling
        run: |
          rm .github/repair_all_remote_mutations_v2.py
          rm .github/repair_all_remote_mutations_v2_driver.py
          rm .github/workflows/repair-all-remote-mutations-v2.yml

      - name: Commit repaired sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden all remote mutation contracts'
          git push origin HEAD:${GITHUB_REF_NAME}
